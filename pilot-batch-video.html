<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Script Lab — Batch Video Pilot</title><style>body{font:16px system-ui;max-width:780px;margin:25px auto;padding:0 15px;background:#fafafa;color:#202020}textarea,input,button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;border:1px solid #bbb;border-radius:8px;font:inherit}textarea{height:180px}button{background:#173c69;color:white;border:0}button:disabled{opacity:.5}.item{background:white;border:1px solid #ddd;border-radius:9px;padding:12px;margin:12px 0;overflow-wrap:anywhere}pre{white-space:pre-wrap;font-size:12px}small{color:#555}</style><h2>Batch Video Training — Preview Only</h2><p>Paste up to 100 YouTube or Meta links (one per line). Analyses run one at a time; no learnings are saved or sent to Creative Brain.</p><label>Pilot token<input id="token" type="password" autocomplete="off" placeholder="Pilot access token"></label><label>Video links<textarea id="links" placeholder="https://www.youtube.com/watch?v=IrD3B0NfW-4"></textarea></label><button id="start">Analyse links</button><button id="export" disabled>Export review JSON</button><p id="status"></p><div id="results"></div><script>
const token=document.getElementById('token'),links=document.getElementById('links'),start=document.getElementById('start'),exp=document.getElementById('export'),status=document.getElementById('status'),results=document.getElementById('results');let data=[];
start.onclick=async()=>{const urls=[...new Set(links.value.split(/\s+/).map(s=>s.trim()).filter(Boolean))].slice(0,100);if(!token.value||!urls.length){status.textContent='Enter token and at least one link.';return}data=[];results.replaceChildren();start.disabled=true;exp.disabled=true;
for(let i=0;i<urls.length;i++){status.textContent='Processing '+(i+1)+' of '+urls.length+' (keep page open)';let item;try{const r=await fetch('/api/pilot-batch-video',{method:'POST',headers:{'Content-Type':'application/json','x-pilot-token':token.value},body:JSON.stringify({url:urls[i]})});item=await r.json()}catch(e){item={url:urls[i],status:'connection_failed',error:e.message}}data.push(item);const div=document.createElement('div');div.className='item';const heading=document.createElement('strong');heading.textContent=(i+1)+'. '+urls[i]+' — '+item.status;div.append(heading);const pre=document.createElement('pre');pre.textContent=JSON.stringify(item.analysis||item,null,2);div.append(pre);results.append(div);exp.disabled=false}
status.textContent='Finished '+data.length+' link(s). Only results marked analysed_pending_approval have actual media evidence. No training data saved.';start.disabled=false};
exp.onclick=()=>{const blob=new Blob([JSON.stringify({pilot:true,results:data},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='script-lab-pilot-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></html>
